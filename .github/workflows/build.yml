name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows .NET build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET info
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore
        shell: pwsh
        run: dotnet restore .\Viewer.sln --verbosity minimal

      - name: Build Release
        shell: pwsh
        run: dotnet build .\Viewer.sln -c Release --no-restore --verbosity minimal

      - name: List build outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .\src\Viewer.App\bin) {
            Get-ChildItem .\src\Viewer.App\bin -Recurse | Select-Object FullName, Length, LastWriteTime
          } else {
            Write-Host "No bin directory was created."
          }
